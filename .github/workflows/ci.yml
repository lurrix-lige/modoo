name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Lint + TypeCheck + Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx eslint 'src/**/*.ts' --max-warnings 0
      - run: npx tsc --noEmit
      - run: npm test -- --coverage

  frontend:
    name: Frontend (Lint + TypeCheck + Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modoo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: modoo/package-lock.json
      - run: npm ci
      - run: npx eslint 'src/**/*.{ts,tsx}' --max-warnings 0
      - run: npx tsc --noEmit
      - run: npm test -- --coverage

  format-check:
    name: Format Check (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx prettier --check '**/*.{ts,tsx,js,jsx,json,md,yaml,yml}' --ignore-path .gitignore
